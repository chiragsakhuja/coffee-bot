[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "coffee-bot"
version = "0.1.0"
description = "Telegram bot that uses Claude to maintain a coffee menu rendered for a TRMNL e-ink display"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=1.9",
    "python-telegram-bot>=22.0",
    "jinja2>=3.1",
    "playwright>=1.50",
    "pillow>=11.0",
    "pydantic>=2.8",
    "python-dotenv>=1.0",
    "aiohttp>=3.10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
coffee-bot = "coffee_bot.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
